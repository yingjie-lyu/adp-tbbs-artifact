[package]
name = "robot-bbs"
version = "0.1.0"
edition = "2021"
description = "Robust threshold BBS+ in two rounds (Tang et al.), on threshold CL encryption"

[dependencies]
bicycl = { path = "../bicycl" }
bls12_381 = { version = "0.8", features = ["experimental"] }
ff = "0.13"
group = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.9"
tcl = { path = "../tcl" }
threshold-bbs = { path = ".." }
