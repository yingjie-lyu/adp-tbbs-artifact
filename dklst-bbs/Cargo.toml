[package]
name = "dklst-bbs"
version = "0.1.0"
edition = "2021"
description = "DKLs18-OT-based threshold BBS+ baseline (DKLST)"

[dependencies]
sl-oblivious = { path = "../sl-oblivious" }
bls12_381 = { version = "0.8", features = ["experimental"] }
ff = "0.13"
group = "0.13"
bytemuck = "1"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.9"
subtle = "2.5"

[build-dependencies]
cc = "1"

[features]
default = []
# Hash the OT transcripts with SHA-256 (SHA-NI accelerable) instead of STROBE/Keccak.
sha-transcript = ["sl-oblivious/sha-transcript"]
# Second DKLST backend: libOTe's SoftSpokenOT (cpp/libote_shim.cc). Needs a libOTe build.
libote = []

[workspace]
