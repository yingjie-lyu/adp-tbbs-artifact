[package]
name = "tcl"
version = "0.1.0"
edition = "2021"
description = "Threshold CL / ElGamal core shared by the WMC24 and ROBOT threshold BBS+ crates"

[dependencies]
bicycl = { path = "../bicycl" }
bls12_381 = { version = "0.8", features = ["experimental"] }
ff = "0.13"
group = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.9"
threshold-bbs = { path = ".." }
