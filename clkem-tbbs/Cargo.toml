[package]
name = "clkem-tbbs"
version = "0.1.0"
edition = "2021"
description = "CL-KEM based three-round threshold BBS+ signatures (Heng et al., refs/)"

[dependencies]
bicycl = { path = "../bicycl" }
bls12_381 = { version = "0.8", features = ["experimental"] }
group = "0.13"
ff = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.9"
threshold-bbs = { path = ".." }
