[package]
name = "wmc24-bbs"
version = "0.1.0"
edition = "2021"
description = "Threshold BBS+ from threshold CL encryption (Wong et al., NDSS'24), BBS+ only"

[dependencies]
bicycl = { path = "../bicycl" }
bls12_381 = { version = "0.8", features = ["experimental"] }
ff = "0.13"
group = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.9"
tcl = { path = "../tcl" }
threshold-bbs = { path = ".." }
